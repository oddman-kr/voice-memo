name: 실행 테스트

on:
  workflow_run:
    workflows: ["안드로이드 앱 빌드"]
    types: [completed]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 최신 APK 받기
        run: |
          url=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | python3 -c "import json,sys;print(json.load(sys.stdin)['assets'][0]['browser_download_url'])")
          echo "$url"
          curl -sL -o app.apk "$url"
          ls -l app.apk

      - name: KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 테스트 스크립트 만들기
        run: |
          cat > smoke.sh <<'SH'
          set +e
          adb install -r app.apk
          adb logcat -c
          adb shell am start -W -n kr.oddman.voicememo/.MainActivity
          sleep 8
          adb shell am start -W -n kr.oddman.voicememo/.RecordActivity
          sleep 5
          adb logcat -d -b crash > crash.txt
          adb logcat -d | grep -E "AndroidRuntime|FATAL|kr.oddman|System.err" | head -150 > app.txt
          echo "---- crash ----"; cat crash.txt; echo "---- app ----"; cat app.txt
          msg=$( (cat crash.txt; echo ====; head -60 app.txt) | head -100 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          if [ -s crash.txt ]; then echo "::error title=crash::${msg}"; else echo "::notice title=no-crash::${msg}"; fi
          exit 0
          SH
          chmod +x smoke.sh

      - name: 에뮬레이터에서 실행
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash ./smoke.sh
