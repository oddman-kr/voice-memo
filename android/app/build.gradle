plugins { id 'com.android.application' }

android {
    namespace 'kr.oddman.voicememo'
    compileSdk 36
    defaultConfig {
        applicationId 'kr.oddman.voicememo'
        minSdk 26
        targetSdk 35
        def runNo = System.getenv('GITHUB_RUN_NUMBER') ?: '1'
        versionCode Integer.parseInt(runNo)
        versionName "1.0.${runNo}"
    }
    signingConfigs {
        release {
            storeFile file('voicememo.jks')
            storePassword 'voicememo-app'
            keyAlias 'voicememo'
            keyPassword 'voicememo-app'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}
